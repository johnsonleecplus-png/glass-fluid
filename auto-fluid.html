<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Auto Fluid — Synthwave Looping 10s</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #presets {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 10;
    background: rgba(10, 1, 24, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 109, 213, 0.18);
    border-radius: 10px; padding: 5px;
  }
  #presets button {
    padding: 7px 14px; background: transparent; border: none;
    color: rgba(80, 50, 120, 0.55);
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    border-radius: 6px; cursor: pointer; transition: all .15s;
  }
  #presets button:hover { color: #4a2860; background: rgba(180, 100, 200, 0.08); }
  #presets button.active { color: #5766f5; background: rgba(87, 102, 245, 0.10); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="presets">
  <button data-p="glass" class="active">Glass</button>
  <button data-p="ice">Ice</button>
  <button data-p="tech">Tech</button>
  <button data-p="tron">Tron</button>
  <button data-p="vaporwave">Vaporwave</button>
</div>
<script type="module">
// =========================================================================
//  Self-running, perfectly-looping fluid (10s period, no mouse needed)
//  Designed for puppeteer screencast → 10s mp4 with seamless loop.
// =========================================================================

const LOOP = 10.0;                              // seconds (one full cycle)
const TWO_PI = Math.PI * 2;

// -------------------------------------------------------------------------
//  Shaders
// -------------------------------------------------------------------------
const VERT = `#version 300 es
in vec2 a_pos;
out vec2 vUv;
void main() {
  vUv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

// Pass 1: paint "auto mouse" onto a flow map. Trail decays each frame.
const FRAG_FLOW = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uPrev;
uniform vec2 uMouse;        // normalized 0..1 (y up)
uniform vec2 uVel;          // delta per second
uniform float uRadius;
uniform float uStrength;
uniform float uDecay;

void main() {
  vec4 prev = texture(uPrev, vUv);
  prev.r *= uDecay;
  prev.gb = mix(vec2(0.5), prev.gb, uDecay);

  float d = distance(vUv, uMouse);
  float influence = exp(-d * d / (uRadius * uRadius * 0.5));
  influence = max(0.0, influence - 0.005);

  float speed = length(uVel);
  float totalStrength = uStrength * 0.3 + min(speed * 3.0, 0.7) * uStrength;

  prev.r = max(prev.r, influence * totalStrength);
  float blendAmt = influence * min(totalStrength, 0.4) * 0.3;
  prev.g = mix(prev.g, clamp(uVel.x * 2.0 + 0.5, 0.0, 1.0), blendAmt);
  prev.b = mix(prev.b, clamp(uVel.y * 2.0 + 0.5, 0.0, 1.0), blendAmt);

  o = prev;
}`;

// Pass 2: domain-warped FBM, mouse-tinted glow, vignette.
// Two flavors: PERIODIC (default, perfect 10s loop) and CONTINUOUS
// (?continuous=1, monotonic time → unique motion every frame, used for
// long non-looping renders like 60s clips).
const FRAG_MAIN_HEAD = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;

uniform float uTime;            // [0,1] periodic, or seconds when CONTINUOUS
uniform vec2  uRes;
uniform float uPxRatio;
uniform sampler2D uFlow;
uniform vec3  uC1, uC2, uC3, uC4, uC5;
uniform float uScale;
uniform float uDistort;
uniform float uSwirl;

float hash21(vec2 p) {
  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y) * 2.0 - 1.0;
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.6;
  for (int i = 0; i < 4; i++) {
    v += a * noise(p);
    p = p * 2.03 + 1.7;
    a *= 0.4;
  }
  return v;
}

void main() {`;

const FRAG_MAIN_TAIL = `
  // 7. Mouse accent removed — c5 still appears via the 2-zone mesh below
  //    (line 162) but as part of the gradient, not as a focal blob.
  //    Motion is preserved by the flow UV warp (line 142) and swirl (144).

  // 8. Soft vignette — very gentle so the white background stays clean
  float vig = 1.0 - smoothstep(0.55, 1.05, length(uv - 0.5));
  col = mix(col * 0.92, col, vig);

  o = vec4(col, 1.0);
}`;

// Shared mesh blend function — used by both periodic and continuous bodies.
// Two Gaussian-falloff color zones (pink upper-left, blue lower-right) on
// a white base. Fluid noise n/sw modulate the zone intensity for soft
// "breathing" without uniform color wash.
const FRAG_MAIN_MESH_BLEND = `
  // Two radial color zones, aspect-corrected so blobs are circular on screen
  vec2 pinkC = vec2(0.26, 0.78);
  vec2 blueC = vec2(0.70, 0.24);
  vec2 pDelta = (uv - pinkC) * vec2(aspect, 1.0);
  vec2 bDelta = (uv - blueC) * vec2(aspect, 1.0);
  float pD = length(pDelta);
  float bD = length(bDelta);
  float pW = exp(-pD * pD * 6.5);
  float bW = exp(-bD * bD * 5.5);

  // White base, then layer in mid-tones and cores via the noise field
  vec3 col = uC1;
  col = mix(col, uC2, pW * (0.45 + 0.55 * n));
  col = mix(col, uC3, bW * (0.50 + 0.50 * sw));
  col = mix(col, uC4, pW * smoothstep(0.30, 0.70, n) * 0.85);
  col = mix(col, uC5, bW * smoothstep(0.30, 0.70, sw) * 0.85);
`;

const FRAG_MAIN_BODY_PERIODIC = `
  float aspect = uRes.x / uRes.y;
  vec2 uv  = gl_FragCoord.xy / uRes;
  vec2 suv = vec2(uv.x * aspect, uv.y) * uScale;

  // 1. Flow map
  vec4 flow = texture(uFlow, uv);
  float influence = flow.r;
  vec2 flowDir = (flow.gb - 0.5) * 2.0;

  // 2. Mouse-pushed UV
  suv += flowDir * influence * uDistort * 0.5;
  // 3. Mouse swirl
  float swirlA = influence * uSwirl * 2.0;
  float cs = cos(swirlA), sn = sin(swirlA);
  vec2 origin = vec2(uv.x * aspect, uv.y) * uScale;
  suv = origin + mat2(cs, sn, -sn, cs) * (suv - origin);

  // 4. Domain warp with periodic time wrap
  float a = uTime * 6.28318530718;
  vec2 tShift = vec2(sin(a), cos(a));
  vec2 warp = vec2(fbm(suv + 0.0), fbm(suv + 5.2));
  vec2 uvD = suv + (warp - 0.0) * 0.6 + tShift * 0.4;

  // 5. Fluid texture
  float f = fbm(uvD + tShift * 0.3);
  float n = f * 0.5 + 0.5;
  float sw = fbm(uvD * 0.8 + tShift.yx * 0.5) * 0.5 + 0.5;

  // 6. 2-zone mesh color blend
  ` + FRAG_MAIN_MESH_BLEND + `
`;

// CONTINUOUS body: same shape, but uTime is raw monotonic seconds and is
// fed straight into fbm offsets so every frame is at a unique position.
const FRAG_MAIN_BODY_CONTINUOUS = `
  float aspect = uRes.x / uRes.y;
  vec2 uv  = gl_FragCoord.xy / uRes;
  vec2 suv = vec2(uv.x * aspect, uv.y) * uScale;

  // 1. Flow map
  vec4 flow = texture(uFlow, uv);
  float influence = flow.r;
  vec2 flowDir = (flow.gb - 0.5) * 2.0;

  // 2. Mouse-pushed UV
  suv += flowDir * influence * uDistort * 0.5;
  // 3. Mouse swirl
  float swirlA = influence * uSwirl * 2.0;
  float cs = cos(swirlA), sn = sin(swirlA);
  vec2 origin = vec2(uv.x * aspect, uv.y) * uScale;
  suv = origin + mat2(cs, sn, -sn, cs) * (suv - origin);

  // 4. Domain warp. Monotonic seconds → tShift grows linearly → each frame
  //    samples a different point in noise space. At 0.6 unit/s, 60s = 36
  //    units of offset (>> fbm feature size), so no two frames repeat.
  vec2 tShift = vec2(uTime * 0.6, uTime * 0.42);
  vec2 warp = vec2(fbm(suv + 0.0), fbm(suv + 5.2));
  vec2 uvD = suv + (warp - 0.0) * 0.6 + tShift * 0.4;

  // 5. Fluid texture
  float f = fbm(uvD + tShift * 0.3);
  float n = f * 0.5 + 0.5;
  float sw = fbm(uvD * 0.8 + tShift.yx * 0.5) * 0.5 + 0.5;

  // 6. 2-zone mesh color blend
  ` + FRAG_MAIN_MESH_BLEND + `
`;

// -------------------------------------------------------------------------
//  GL setup
// -------------------------------------------------------------------------`;

// -------------------------------------------------------------------------
//  GL setup
// -------------------------------------------------------------------------
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {
  alpha: false,
  premultipliedAlpha: false,
  powerPreference: 'low-power',
  antialias: false,
  preserveDrawingBuffer: true,
});

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function link(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error('Link error:', gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}
// Continuous mode (?continuous=1) — uTime becomes raw monotonic seconds and
// the shader's domain warp / fbm offsets use it linearly so every frame is
// at a unique position in noise space. Used for long non-looping renders.
const CONTINUOUS = /[?&]continuous=1\b/.test(location.search) || /[?&]c=1\b/.test(location.search);
const FRAG_MAIN_SRC = CONTINUOUS
  ? FRAG_MAIN_HEAD + FRAG_MAIN_BODY_CONTINUOUS + FRAG_MAIN_TAIL
  : FRAG_MAIN_HEAD + FRAG_MAIN_BODY_PERIODIC + FRAG_MAIN_TAIL;
const vs = compile(gl.VERTEX_SHADER, VERT);
const fsFlow = compile(gl.FRAGMENT_SHADER, FRAG_FLOW);
const fsMain = compile(gl.FRAGMENT_SHADER, FRAG_MAIN_SRC);
const progFlow = link(vs, fsFlow);
const progMain = link(vs, fsMain);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
function bindQuad(program) {
  const loc = gl.getAttribLocation(program, 'a_pos');
  if (loc < 0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

// Ping-pong FBO
function makeFBO(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fbo, tex, w, h };
}

let fboA, fboB, ping = true, w = 0, h = 0, fw = 0, fh = 0;
function clearFBO(fbo) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fbo);
  gl.viewport(0, 0, fbo.w, fbo.h);
  gl.clearColor(0, 0.5, 0.5, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  w = Math.round(canvas.clientWidth * dpr);
  h = Math.round(canvas.clientHeight * dpr);
  canvas.width = w; canvas.height = h;
  fw = Math.max(64, Math.round(w / 4));
  fh = Math.max(64, Math.round(h / 4));
  if (fboA) { gl.deleteFramebuffer(fboA.fbo); gl.deleteTexture(fboA.tex); }
  if (fboB) { gl.deleteFramebuffer(fboB.fbo); gl.deleteTexture(fboB.tex); }
  fboA = makeFBO(fw, fh); fboB = makeFBO(fw, fh);
  clearFBO(fboA); clearFBO(fboB);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
}

// -------------------------------------------------------------------------
//  "Auto mouse" trajectory — closed curve, returns to start each LOOP
//  Using a lemniscate (∞) so the visual moves through the whole frame.
// -------------------------------------------------------------------------
const RADIUS_X = 0.28;
const RADIUS_Y = 0.18;
const OMEGA = TWO_PI / LOOP;

function mouseAt(t) {
  // t in seconds. Using sin(t·ω) makes both position and velocity close
  // perfectly at t=0 and t=LOOP.
  const phase = t * OMEGA;
  return {
    x: 0.5 + RADIUS_X * Math.sin(phase),
    y: 0.5 + RADIUS_Y * Math.sin(phase * 2) * 0.5, // lemniscate feel
  };
}
function mouseVelAt(t) {
  // Analytical derivative of mouseAt (in units / second)
  const phase = t * OMEGA;
  return {
    vx: RADIUS_X * OMEGA * Math.cos(phase),
    vy: RADIUS_Y * OMEGA * Math.cos(phase * 2),
  };
}

// -------------------------------------------------------------------------
//  Color palettes — synthwave / vaporwave / outrun
//  c5 doubles as the mouse-trail highlight (no warm white glow).
// -------------------------------------------------------------------------
const PALETTES = {
  // ── Light / tech ───────────────────────────────────────────
  glass: {
    c1: [1.00, 1.00, 1.00],   // #ffffff — pure white base
    c2: [1.00, 0.84, 0.93],   // #ffd6ed — soft pink (mid)
    c3: [0.68, 0.72, 1.00],   // #aeb8ff — soft periwinkle (mid)
    c4: [0.96, 0.62, 0.84],   // #f59ed6 — deeper pink (core)
    c5: [0.34, 0.40, 0.96],   // #5766f5 — deeper indigo (core)
  },
  tech: {
    c1: [0.88, 0.94, 1.00],   // #e0f0ff — pale sky
    c2: [0.55, 0.82, 0.96],   // #8dd1f5 — soft sky blue
    c3: [0.25, 0.62, 0.92],   // #409eeb — electric blue
    c4: [0.48, 0.35, 0.95],   // #7a59f2 — electric purple
    c5: [0.30, 1.00, 0.78],   // #4dffc7 — mint accent
  },
  ice: {
    c1: [0.97, 0.99, 1.00],   // #f7fcff — near white
    c2: [0.78, 0.90, 0.98],   // #c7e5fa — pale ice
    c3: [0.50, 0.72, 0.95],   // #80b8f2 — light blue
    c4: [0.65, 0.55, 0.95],   // #a68cf2 — soft lavender
    c5: [0.40, 0.95, 0.90],   // #66f2e6 — aqua
  },
  tron: {
    c1: [0.04, 0.10, 0.22],   // #0a1a38 — deep navy
    c2: [0.10, 0.40, 0.75],   // #1a66bf — ocean blue
    c3: [0.20, 0.78, 0.98],   // #33c7fa — neon cyan
    c4: [0.70, 0.98, 1.00],   // #b3faff — light cyan
    c5: [1.00, 1.00, 1.00],   // #ffffff — pure white accent
  },
  // ── Synthwave / vaporwave (kept for switch) ────────────────
  vaporwave: {
    c1: [0.05, 0.00, 0.13],   // #0d0221 — near-black purple
    c2: [0.16, 0.04, 0.31],   // #290a50 — deep purple
    c3: [0.55, 0.10, 0.65],   // #8c1aa6 — purple
    c4: [1.00, 0.36, 0.78],   // #ff5cc6 — neon pink (c4)
    c5: [0.00, 0.94, 1.00],   // #00f0ff — neon cyan (highlight)
  },
  sunset: {
    c1: [0.04, 0.00, 0.18],   // #0a002e
    c2: [0.35, 0.05, 0.45],   // #590d73 — purple
    c3: [0.85, 0.12, 0.55],   // #d91f8c — hot pink
    c4: [1.00, 0.36, 0.16],   // #ff5c2a — sunset orange
    c5: [1.00, 0.85, 0.30],   // #ffd84c — yellow
  },
  outrun: {
    c1: [0.05, 0.00, 0.15],   // #0d0026
    c2: [0.30, 0.05, 0.50],   // #4d0d80 — purple
    c3: [0.80, 0.10, 0.55],   // #cc1a8c — magenta
    c4: [1.00, 0.78, 0.10],   // #ffc71a — gold
    c5: [0.10, 0.85, 1.00],   // #1ad9ff — cyan
  },
  hotpink: {
    c1: [0.10, 0.00, 0.20],   // #1a0033
    c2: [0.45, 0.05, 0.45],   // #730d73 — magenta
    c3: [0.90, 0.20, 0.70],   // #e633b3 — hot pink
    c4: [1.00, 0.55, 0.90],   // #ff8ce6 — light pink
    c5: [0.00, 0.85, 1.00],   // #00d9ff — cyan accent
  },
};
const params = {
  decay: 0.94,
  distort: 0.8,
  swirl: 0.35,
  scale: 1.6,
  radius: 0.11,
  strength: 1.5,
};
let colors = { ...PALETTES.glass };

// Recording mode (?record=1 or hash) → hide UI for clean mp4 output.
// In dev/normal use the preset bar stays visible at the top.
const RECORD_MODE = /[?&]record=1\b/.test(location.search) || location.hash === '#record';
if (RECORD_MODE) {
  const ui = document.getElementById('presets');
  if (ui) ui.style.display = 'none';
  // Optional palette override via ?p=outrun etc.
  const m = /[?&]p=([a-z]+)/.exec(location.search);
  if (m && PALETTES[m[1]]) {
    colors = { ...PALETTES[m[1]] };
  }
}

// Preset switcher
document.querySelectorAll('#presets button').forEach((btn) => {
  btn.addEventListener('click', () => {
    const p = PALETTES[btn.dataset.p];
    if (!p) return;
    colors = { ...p };
    document.querySelectorAll('#presets button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// -------------------------------------------------------------------------
//  Render loop
// -------------------------------------------------------------------------
const locFlow = {
  prev: gl.getUniformLocation(progFlow, 'uPrev'),
  mouse: gl.getUniformLocation(progFlow, 'uMouse'),
  vel: gl.getUniformLocation(progFlow, 'uVel'),
  radius: gl.getUniformLocation(progFlow, 'uRadius'),
  strength: gl.getUniformLocation(progFlow, 'uStrength'),
  decay: gl.getUniformLocation(progFlow, 'uDecay'),
};
const locMain = {
  time: gl.getUniformLocation(progMain, 'uTime'),
  res: gl.getUniformLocation(progMain, 'uRes'),
  pxRatio: gl.getUniformLocation(progMain, 'uPxRatio'),
  flow: gl.getUniformLocation(progMain, 'uFlow'),
  c1: gl.getUniformLocation(progMain, 'uC1'),
  c2: gl.getUniformLocation(progMain, 'uC2'),
  c3: gl.getUniformLocation(progMain, 'uC3'),
  c4: gl.getUniformLocation(progMain, 'uC4'),
  c5: gl.getUniformLocation(progMain, 'uC5'),
  scale: gl.getUniformLocation(progMain, 'uScale'),
  distort: gl.getUniformLocation(progMain, 'uDistort'),
  swirl: gl.getUniformLocation(progMain, 'uSwirl'),
};

const FRAME_MS = 1000 / 30;
let lastT = performance.now();
let acc = 0;
let running = true;
let startTime = 0;

function render(t) {
  if (!running) return;
  requestAnimationFrame(render);

  acc += t - lastT;
  lastT = t;
  if (acc < FRAME_MS) return;
  acc = acc % FRAME_MS;

  // Time. Periodic mode wraps every LOOP seconds (perfect 10s loop).
  // Continuous mode is monotonic seconds — drives a non-repeating render.
  const rawSec = (t - startTime) / 1000;
  const seconds = CONTINUOUS ? rawSec : (rawSec % LOOP);
  const tNorm = seconds / LOOP; // 0..1

  const m = mouseAt(seconds);
  const v = mouseVelAt(seconds);

  // Pass 1
  const src = ping ? fboB : fboA;
  const dst = ping ? fboA : fboB;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, fw, fh);
  gl.useProgram(progFlow);
  bindQuad(progFlow);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(locFlow.prev, 0);
  gl.uniform2f(locFlow.mouse, m.x, m.y);
  gl.uniform2f(locFlow.vel, v.vx, v.vy);
  gl.uniform1f(locFlow.radius, params.radius);
  gl.uniform1f(locFlow.strength, params.strength);
  gl.uniform1f(locFlow.decay, params.decay);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Pass 2
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(progMain);
  bindQuad(progMain);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dst.tex);
  gl.uniform1i(locMain.flow, 0);
  gl.uniform1f(locMain.time, CONTINUOUS ? seconds : tNorm);
  gl.uniform2f(locMain.res, w, h);
  gl.uniform1f(locMain.pxRatio, window.devicePixelRatio || 1);
  gl.uniform1f(locMain.scale, params.scale);
  gl.uniform1f(locMain.distort, params.distort);
  gl.uniform1f(locMain.swirl, params.swirl);
  gl.uniform3f(locMain.c1, colors.c1[0], colors.c1[1], colors.c1[2]);
  gl.uniform3f(locMain.c2, colors.c2[0], colors.c2[1], colors.c2[2]);
  gl.uniform3f(locMain.c3, colors.c3[0], colors.c3[1], colors.c3[2]);
  gl.uniform3f(locMain.c4, colors.c4[0], colors.c4[1], colors.c4[2]);
  gl.uniform3f(locMain.c5, colors.c5[0], colors.c5[1], colors.c5[2]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  ping = !ping;
}

resize();
window.addEventListener('resize', resize);

const obs = new IntersectionObserver((es) => {
  running = es[0].isIntersecting;
  if (running) {
    startTime = performance.now();
    lastT = performance.now();
    requestAnimationFrame(render);
  }
}, { threshold: 0 });
obs.observe(canvas);
if (running) {
  startTime = performance.now();
  lastT = performance.now();
  requestAnimationFrame(render);
}
</script>
